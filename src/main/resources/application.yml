server:
  port: 8080

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

exotel:
  api:
    key: ${EXOTEL_API_KEY:dummy_key}
    token: ${EXOTEL_API_TOKEN:dummy_token}
  account:
    sid: ${EXOTEL_ACCOUNT_SID:dummy_sid}
  subdomain: ${EXOTEL_SUBDOMAIN:api.in.exotel.com}

gupshup:
  api:
    key: ${GUPSHUP_API_KEY:dummy_key}
  source:
    number: ${GUPSHUP_SOURCE_NUMBER:919876543210}

aws:
  ses:
    configuration-set-name: ${AWS_SES_CONFIG_SET:NotificationConfigSet}

platform:
  webhook:
    base-url: ${WEBHOOK_BASE_URL:http://localhost:8080}
